  <style>
    /* Estilo embutido: a página de erro pode ser servida em qualquer caminho, então não depende de arquivo nenhum. */
    html, body { margin: 0; height: 100%; }

      display: flex; align-items: center; justify-content: center; text-align: center;

    h1 { margin: 0 0 14px; font-size: 34px; letter-spacing: 0.08em; text-transform: uppercase; color: #d9b45a; text-shadow: 0 2px 0 #2a1806; }
    p { margin: 0 0 22px; font-size: 17px; line-height: 1.5; }
    a { display: inline-block; padding: 11px 22px; color: #1a0f04; background: linear-gradient(180deg, #f6e2a0, #d9b45a 55%, #8a6421); border: 1px solid #1a0f04; text-decoration: none; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700; font-size: 14px; }
    a:focus-visible { outline: 2px solid #f6e2a0; outline-offset: 3px; }
  </style>
